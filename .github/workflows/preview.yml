# Temporary (development branch only): run the probe + a full scrape on
# GitHub's runners, whose IPs are what production scrapes from.
name: Preview scrape (dev)
on:
  push:
    branches: [claude/upbeat-dijkstra-7hjfag]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Scrape
        run: BROWSER_HEADED=1 BROWSER_PAGES=6 xvfb-run -a npx tsx scraper/scrape.ts --drops 2>&1 | tee scrape.log
        continue-on-error: true
      - name: Probe
        run: BROWSER_HEADED=1 PROBE_OUT=probe-out xvfb-run -a node scripts/probe.mjs --file probe/targets.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview
          path: |
            probe-out
            .build
            scrape.log
          retention-days: 5
