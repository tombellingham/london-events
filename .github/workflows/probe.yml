name: Probe (temporary)
on:
  push:
    branches: [claude/upbeat-dijkstra-7hjfag]
    paths: [probe/**, .github/workflows/probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node probe/probe.mjs probe/targets.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-out, path: probe-out, retention-days: 3 }
